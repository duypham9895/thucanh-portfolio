<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trần Tôn Nữ Thục Anh — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Be+Vietnam+Pro:wght@200;300;400;500&family=Italianno&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F4F2ED;--paper:#FBFAF6;--ink:#2B2A25;--soft:#7B7869;--line:#DAD5C7;--pink:#CB7885;--rose:#893941;--olive:#5E6623;--citron:#D4D994;--beige:#D0A583;--accent:var(--pink);--accent2:var(--olive);--disp:"Cormorant Garamond",Georgia,serif;--sans:"Be Vietnam Pro","Helvetica Neue",Helvetica,sans-serif;--script:"Italianno",cursive;--scale:1}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none;transition:color .25s}
a:hover{color:var(--accent)}
::selection{background:var(--citron);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 46px}
.eyebrow{font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.disp{font-family:var(--disp);font-weight:300;line-height:1.02;letter-spacing:-.005em}
.it{font-style:italic}
.script{font-family:var(--script);font-weight:400;line-height:.85}
.body{font-size:15px;line-height:1.8;letter-spacing:.002em;color:var(--soft)}
.rule{height:1px;background:var(--line);border:0}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:12px 24px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;transition:all .3s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-solid{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-solid:hover{background:var(--rose);border-color:var(--rose);color:#fff}
.pill{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
image-slot{display:block;width:100%;height:100%}
.frame{position:relative;background:var(--paper);border:1px solid var(--line);overflow:hidden}
/* folder stack */
.stack{display:flex;flex-direction:column;position:relative;min-width:0;width:100%}
.folder{position:relative;cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .3s;margin-top:-16px}
.clip + .folder{margin-top:0}
.folder:hover{transform:translateY(-12px)}
.folder:hover .tab{filter:brightness(1.06)}
.tab{height:44px;width:max-content;max-width:calc(100% - var(--off));margin-left:var(--off);border-radius:14px 20px 0 0;display:flex;align-items:center;gap:12px;padding:0 20px;box-shadow:0 -1px 0 rgba(0,0,0,.05)}
.tabname{font-family:var(--disp);font-size:16.5px;letter-spacing:.03em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder-body{height:86px;border-radius:0 10px 2px 2px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 30px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.fnote{font-size:12.5px;letter-spacing:.05em;opacity:.85}
.fgo{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;white-space:nowrap;transition:opacity .3s,transform .35s}
.folder:hover .fgo{opacity:1;transform:translateX(6px)}
.clip{width:16px;height:52px;border-radius:9px;border:3px solid #B9B3A4;position:absolute;right:44px;top:-20px;background:transparent;z-index:3}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding-bottom:16px;border-bottom:2px solid var(--sc);margin-bottom:40px;flex-wrap:wrap}
.crow{display:grid;grid-template-columns:56px 1fr 210px 130px;gap:26px;align-items:start;padding:32px 0;border-top:1px solid var(--line);cursor:pointer;transition:padding-left .4s cubic-bezier(.2,.7,.2,1)}
.crow:hover{padding-left:16px}
.crow:hover .ct{color:var(--accent)}
.ct{font-family:var(--disp);font-weight:300;font-size:calc(42px * var(--scale));line-height:1.05;transition:color .3s}
.ccard{cursor:pointer}
.ccard:hover .ct{color:var(--accent)}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;animation:rise .55s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{transform:translateY(2.5%);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:999px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;animation:rise .3s}
.certstage{position:relative;height:clamp(660px,92vw,900px);margin-top:40px}
.certportrait{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:clamp(180px,27vw,330px);z-index:5}
.cert{position:absolute;width:clamp(104px,13.5vw,168px);z-index:8}
.certimg{transform:rotate(var(--r));transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s;box-shadow:0 12px 34px rgba(43,42,37,.14)}
.cert:hover{z-index:30}
.cert:hover .certimg{transform:translateY(-12px) rotate(0deg) scale(1.06);box-shadow:0 28px 62px rgba(43,42,37,.26)}
.certcap{display:block;margin-top:10px;font-size:clamp(9.5px,1.05vw,11.5px);line-height:1.4;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);text-align:center;text-wrap:pretty}
.certcap b{font-weight:400;color:var(--accent);margin-right:5px}
@media (max-width:620px){.certstage{height:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px 18px;align-items:start}.certportrait{position:static;transform:none;width:100%;grid-column:1/-1;max-width:300px;margin:0 auto 6px}.cert{position:static!important;width:auto}.certimg{transform:none!important}}
.brandwall{display:flex;flex-wrap:wrap;align-items:center;gap:26px 40px}
.brandwall span{font-family:var(--disp);font-size:clamp(19px,2.1vw,30px);padding:0}
.blogo{width:auto;object-fit:contain;opacity:.9}
.brandwall span:nth-child(even){font-style:italic;color:var(--olive)}
.backtop{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
@media (max-width:900px){.wrap{padding:0 22px}.crow{grid-template-columns:34px 1fr;gap:14px}.crow .cmeta,.crow .ckpi{display:none}.tab{max-width:none}.folder-body{height:76px;padding:0 20px}.fnote{display:none}.clip{display:none}}
@media (max-width:760px){.gcol2{grid-template-columns:1fr!important;gap:34px!important}.jobrow{grid-template-columns:1fr!important;gap:8px!important}.stack{margin-top:0!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="portfolio-v2-data.jsx"></script>
<script type="text/babel" src="portfolio-v3-data.jsx"></script>
<script type="text/babel" src="portfolio-v3-i18n.jsx"></script>
<script type="text/babel" src="portfolio-v3-app.jsx"></script>
</body>
</html>
